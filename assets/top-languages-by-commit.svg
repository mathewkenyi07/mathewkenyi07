<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200">
  <defs>
    <style>
      * {
        font-family: 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      }
      .title {
        font-size: 19px;
        font-weight: 600;
        fill: #ff79c6;
      }
      .lang-label {
        font-size: 11.5px;
        font-weight: 500;
        fill: #f8f8f2;
      }
      .lang-pct {
        font-size: 10px;
        font-weight: 400;
        fill: #bd93f9;
      }
      .donut-ring {
        fill: none;
        stroke-width: 23;
        transform: rotate(-90deg);
        transform-origin: 245px 115px;
      }
    </style>
  </defs>

  <!-- Background card -->
  <rect x="1" y="1" rx="5" ry="5" width="338" height="198" fill="#282a36" stroke="#282a36" stroke-width="1"/>

  <!-- Card Title -->
  <text x="24" y="34" class="title">Top Languages by Commit</text>

  <!-- Legend Column 1 (5 items) -->
  <g transform="translate(24, 48)">
    <!-- 1. JavaScript -->
    <g transform="translate(0, 0)">
      <rect y="0" width="11" height="11" rx="2" fill="#f1e05a"/>
      <text x="18" y="10" class="lang-label">JavaScript <tspan class="lang-pct">28%</tspan></text>
    </g>
    <!-- 2. TypeScript -->
    <g transform="translate(0, 24)">
      <rect y="0" width="11" height="11" rx="2" fill="#3178c6"/>
      <text x="18" y="10" class="lang-label">TypeScript <tspan class="lang-pct">20%</tspan></text>
    </g>
    <!-- 3. Python -->
    <g transform="translate(0, 48)">
      <rect y="0" width="11" height="11" rx="2" fill="#3572a5"/>
      <text x="18" y="10" class="lang-label">Python <tspan class="lang-pct">14%</tspan></text>
    </g>
    <!-- 4. HTML -->
    <g transform="translate(0, 72)">
      <rect y="0" width="11" height="11" rx="2" fill="#e34c26"/>
      <text x="18" y="10" class="lang-label">HTML <tspan class="lang-pct">12%</tspan></text>
    </g>
    <!-- 5. CSS -->
    <g transform="translate(0, 96)">
      <rect y="0" width="11" height="11" rx="2" fill="#663399"/>
      <text x="18" y="10" class="lang-label">CSS <tspan class="lang-pct">9%</tspan></text>
    </g>
  </g>

  <!-- Legend Column 2 (4 items + badge) -->
  <g transform="translate(122, 48)">
    <!-- 6. C++ -->
    <g transform="translate(0, 0)">
      <rect y="0" width="11" height="11" rx="2" fill="#f34b7d"/>
      <text x="18" y="10" class="lang-label">C++ <tspan class="lang-pct">6%</tspan></text>
    </g>
    <!-- 7. C -->
    <g transform="translate(0, 24)">
      <rect y="0" width="11" height="11" rx="2" fill="#555555"/>
      <text x="18" y="10" class="lang-label">C <tspan class="lang-pct">5%</tspan></text>
    </g>
    <!-- 8. SQL -->
    <g transform="translate(0, 48)">
      <rect y="0" width="11" height="11" rx="2" fill="#e38c00"/>
      <text x="18" y="10" class="lang-label">SQL <tspan class="lang-pct">4%</tspan></text>
    </g>
    <!-- 9. Shell -->
    <g transform="translate(0, 72)">
      <rect y="0" width="11" height="11" rx="2" fill="#89e051"/>
      <text x="18" y="10" class="lang-label">Shell <tspan class="lang-pct">2%</tspan></text>
    </g>
    <!-- Scope Indicator -->
    <g transform="translate(0, 96)">
      <text x="0" y="10" font-size="10px" fill="#50fa7b" font-weight="500">All 9 Languages</text>
    </g>
  </g>

  <!-- Donut Chart (Radius = 43.5, Circumference = 273.32) -->
  <g>
    <!-- Background track -->
    <circle cx="245" cy="115" r="43.5" class="donut-ring" stroke="#21222c" stroke-width="23"/>

    <!-- 1. JavaScript (28% -> len 76.53) -->
    <circle cx="245" cy="115" r="43.5" class="donut-ring" stroke="#f1e05a" stroke-dasharray="75.03 198.29" stroke-dashoffset="0"/>
    
    <!-- 2. TypeScript (20% -> len 54.66) -->
    <circle cx="245" cy="115" r="43.5" class="donut-ring" stroke="#3178c6" stroke-dasharray="53.16 220.16" stroke-dashoffset="-76.53"/>
    
    <!-- 3. Python (14% -> len 38.26) -->
    <circle cx="245" cy="115" r="43.5" class="donut-ring" stroke="#3572a5" stroke-dasharray="36.76 236.56" stroke-dashoffset="-131.19"/>
    
    <!-- 4. HTML (12% -> len 32.80) -->
    <circle cx="245" cy="115" r="43.5" class="donut-ring" stroke="#e34c26" stroke-dasharray="31.30 242.02" stroke-dashoffset="-169.45"/>
    
    <!-- 5. CSS (9% -> len 24.60) -->
    <circle cx="245" cy="115" r="43.5" class="donut-ring" stroke="#663399" stroke-dasharray="23.10 250.22" stroke-dashoffset="-202.25"/>
    
    <!-- 6. C++ (6% -> len 16.40) -->
    <circle cx="245" cy="115" r="43.5" class="donut-ring" stroke="#f34b7d" stroke-dasharray="14.90 258.42" stroke-dashoffset="-226.85"/>
    
    <!-- 7. C (5% -> len 13.67) -->
    <circle cx="245" cy="115" r="43.5" class="donut-ring" stroke="#555555" stroke-dasharray="12.17 261.15" stroke-dashoffset="-243.25"/>
    
    <!-- 8. SQL (4% -> len 10.93) -->
    <circle cx="245" cy="115" r="43.5" class="donut-ring" stroke="#e38c00" stroke-dasharray="9.43 263.89" stroke-dashoffset="-256.92"/>
    
    <!-- 9. Shell (2% -> len 5.47) -->
    <circle cx="245" cy="115" r="43.5" class="donut-ring" stroke="#89e051" stroke-dasharray="3.97 269.35" stroke-dashoffset="-267.85"/>

    <!-- Center Label in Donut Hole -->
    <text x="245" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#f8f8f2">9</text>
    <text x="245" y="124" text-anchor="middle" font-size="8.5" font-weight="600" fill="#50fa7b" letter-spacing="1">LANGS</text>
  </g>
</svg>
